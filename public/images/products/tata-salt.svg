<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="salt-bg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="salt-red" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <rect x="90" y="50" width="620" height="900" rx="36" fill="url(#salt-bg)" stroke="#121a3e" stroke-width="4"/>
  <rect x="130" y="110" width="540" height="110" rx="18" fill="url(#salt-red)"/>
  <text x="400" y="170" font-family="'Instrument Serif', serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle">
    TATA SALT
  </text>
  <text x="400" y="202" font-family="sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    DESH KA NAMAK · VACUUM EVAPORATED
  </text>

  <text x="400" y="270" font-family="sans-serif" font-size="28" font-weight="800" fill="#1e293b" text-anchor="middle">
    IODISED SALT / आयोडीनयुक्त नमक
  </text>

  <!-- Salt Crystal Silhouette -->
  <g transform="translate(340, 310)">
    <polygon points="60,20 100,50 80,100 40,100 20,50" fill="#0284c7" opacity="0.2"/>
    <polygon points="60,30 90,55 75,90 45,90 30,55" fill="#38bdf8" opacity="0.5"/>
    <text x="60" y="70" font-family="sans-serif" font-size="16" font-weight="800" fill="#0369a1" text-anchor="middle">NaCl</text>
  </g>

  <!-- Net Quantity & MRP Panel -->
  <g transform="translate(130, 450)">
    <rect x="0" y="0" width="250" height="100" rx="14" fill="#ffffff" stroke="#121a3e" stroke-width="2"/>
    <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b">NET QUANTITY</text>
    <text x="20" y="74" font-family="sans-serif" font-size="34" font-weight="800" fill="#0b1026">1 kg</text>
    <text x="100" y="72" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b">(When Packed)</text>

    <!-- MRP Box -->
    <rect x="290" y="0" width="250" height="100" rx="14" fill="#ffffff" stroke="#121a3e" stroke-width="2"/>
    <text x="20" y="32" transform="translate(290, 0)" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b">MAX. RETAIL PRICE</text>
    <text x="20" y="70" transform="translate(290, 0)" font-family="sans-serif" font-size="28" font-weight="800" fill="#be123c">₹ 28.00</text>
    <text x="20" y="90" transform="translate(290, 0)" font-family="sans-serif" font-size="11" font-weight="600" fill="#0f172a">INCL. OF ALL TAXES</text>
  </g>

  <!-- Dates & Lot -->
  <g transform="translate(130, 570)">
    <rect x="0" y="0" width="540" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#121a3e">
      PKD: 04/2025 | BATCH NO: LOT-TS-2025-91 | USP: ₹ 28.00 / kg
    </text>
  </g>

  <!-- Manufacturer Details -->
  <g transform="translate(130, 650)">
    <rect x="0" y="0" width="540" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#121a3e">MANUFACTURED BY:</text>
    <text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#0b1026">
      Tata Consumer Products Limited, Mithapur, Okhamandal, Devbhoomi Dwarka, Gujarat - 361345
    </text>
    <text x="20" y="72" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Regd. Office: 1 Bishop Lefroy Road, Kolkata - 700020 · Lic. No. 10014021001192
    </text>
  </g>

  <!-- Consumer Care Box -->
  <g transform="translate(130, 765)">
    <rect x="0" y="0" width="540" height="80" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#15803d">CONSUMER CARE CELL:</text>
    <text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="700" fill="#0b1026">
      Toll Free: 1800-108-4488 | Email: care@tataconsumer.com
    </text>
  </g>
</svg>
