<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="turmeric-bg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="40%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="spice-red" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Pouch Silhouette -->
  <rect x="80" y="50" width="640" height="900" rx="30" fill="url(#turmeric-bg)" stroke="#121a3e" stroke-width="4"/>
  <!-- Top Seal Notch -->
  <path d="M70 120 L95 130 L70 140 M730 120 L705 130 L730 140" stroke="#121a3e" stroke-width="3" fill="none"/>

  <!-- Brand Banner -->
  <rect x="120" y="110" width="560" height="110" rx="16" fill="url(#spice-red)"/>
  <text x="400" y="170" font-family="'Instrument Serif', serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle">
    CATCH SPICES
  </text>
  <text x="400" y="202" font-family="sans-serif" font-size="16" font-weight="600" fill="#fef08a" text-anchor="middle" letter-spacing="3">
    PURITY GUARANTEED · 100% NATURAL
  </text>

  <!-- Product Name -->
  <text x="400" y="280" font-family="sans-serif" font-size="34" font-weight="800" fill="#b45309" text-anchor="middle">
    TURMERIC POWDER / हल्दी पाउडर
  </text>
  <text x="400" y="315" font-family="sans-serif" font-size="16" font-weight="600" fill="#78350f" text-anchor="middle">
    AGMARK GRADE I · HIGH CURCUMIN CONTENT
  </text>

  <!-- Turmeric Root Illustration -->
  <g transform="translate(320, 340)">
    <ellipse cx="80" cy="50" rx="90" ry="40" fill="#f59e0b" transform="rotate(-15 80 50)"/>
    <ellipse cx="60" cy="40" rx="40" ry="18" fill="#d97706" opacity="0.4"/>
    <ellipse cx="110" cy="65" rx="35" ry="15" fill="#d97706" opacity="0.4"/>
  </g>

  <!-- Net Qty Box (Warning: font size 1.8mm instead of 2.5mm) -->
  <g transform="translate(120, 470)">
    <rect x="0" y="0" width="260" height="90" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="600" fill="#78350f">NET WEIGHT / शुद्ध भार</text>
    <!-- Intentionally smaller font to demonstrate font size violation detection -->
    <text x="20" y="65" font-family="sans-serif" font-size="20" font-weight="700" fill="#0b1026">100 g</text>
    <text x="90" y="65" font-family="sans-serif" font-size="11" font-weight="500" fill="#dc2626">(Height: 1.8mm vs Min 2.5mm)</text>
  </g>

  <!-- MRP Box -->
  <g transform="translate(420, 470)">
    <rect x="0" y="0" width="260" height="90" rx="12" fill="#ffffff" stroke="#121a3e" stroke-width="2"/>
    <text x="20" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#64748b">MAX. RETAIL PRICE</text>
    <text x="20" y="65" font-family="sans-serif" font-size="26" font-weight="800" fill="#b91c1c">₹ 42.00</text>
    <text x="125" y="65" font-family="sans-serif" font-size="11" font-weight="600" fill="#121a3e">INCL. OF ALL TAXES</text>
  </g>

  <!-- Batch & Date -->
  <g transform="translate(120, 580)">
    <rect x="0" y="0" width="560" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#121a3e">
      PKD: 01/2025 | BATCH NO: LOT-HLD-998 | USP: ₹ 0.42 / g
    </text>
  </g>

  <!-- Packer Details -->
  <g transform="translate(120, 660)">
    <rect x="0" y="0" width="560" height="80" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#121a3e">PACKED BY:</text>
    <text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#0b1026">
      DS Spices Pvt. Ltd., Sector 67, Noida - 201301, Gautam Buddha Nagar, UP
    </text>
    <text x="20" y="68" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">Lic No. 10015051001304</text>
  </g>

  <!-- Consumer Care (Deficient: phone present, email missing) -->
  <g transform="translate(120, 760)">
    <rect x="0" y="0" width="560" height="85" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400e">
      FOR CONSUMER FEEDBACK / QUERIES:
    </text>
    <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="600" fill="#0b1026">
      Contact Customer Care Executive: Phone: 0120-4032000 | Address: DS Spices, Noida
    </text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#dc2626">
      [MISSING MANDATORY DECLARATION: E-mail address omitted from consumer care panel]
    </text>
  </g>
</svg>
