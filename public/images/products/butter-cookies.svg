<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="cookie-pack-bg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="40%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="cookie-blue" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <!-- Flow-wrap Pillow Pack -->
  <rect x="70" y="80" width="660" height="840" rx="32" fill="url(#cookie-pack-bg)" stroke="#121a3e" stroke-width="4"/>
  <!-- Fin seals -->
  <rect x="70" y="80" width="40" height="840" fill="#93c5fd" opacity="0.3"/>
  <rect x="690" y="80" width="40" height="840" fill="#93c5fd" opacity="0.3"/>

  <!-- Brand Banner -->
  <rect x="130" y="120" width="540" height="120" rx="20" fill="url(#cookie-blue)"/>
  <text x="400" y="180" font-family="'Instrument Serif', serif" font-size="54" font-weight="700" fill="#ffffff" text-anchor="middle">
    BRITANNIA
  </text>
  <text x="400" y="215" font-family="sans-serif" font-size="20" font-weight="800" fill="#facc15" text-anchor="middle" letter-spacing="4">
    GOOD DAY · RICH BUTTER COOKIES
  </text>

  <!-- Cookies Illustration -->
  <g transform="translate(310, 270)">
    <circle cx="90" cy="80" r="70" fill="#f59e0b" stroke="#b45309" stroke-width="3"/>
    <circle cx="65" cy="60" r="6" fill="#78350f"/>
    <circle cx="115" cy="55" r="7" fill="#78350f"/>
    <circle cx="85" cy="95" r="6" fill="#78350f"/>
    <circle cx="120" cy="105" r="5" fill="#78350f"/>
    <path d="M60 110 Q90 135 120 110" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Net Quantity & MRP Panel -->
  <g transform="translate(130, 450)">
    <rect x="0" y="0" width="250" height="95" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
    <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e40af">NET QUANTITY</text>
    <text x="20" y="72" font-family="sans-serif" font-size="32" font-weight="800" fill="#0b1026">200 g</text>
    <text x="115" y="70" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748b">(When Packed)</text>

    <!-- MRP Box -->
    <rect x="290" y="0" width="250" height="95" rx="14" fill="#ffffff" stroke="#1e3a8a" stroke-width="2"/>
    <text x="20" y="32" transform="translate(290, 0)" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e40af">MAX. RETAIL PRICE</text>
    <text x="20" y="68" transform="translate(290, 0)" font-family="sans-serif" font-size="26" font-weight="800" fill="#b91c1c">₹ 40.00</text>
    <text x="20" y="86" transform="translate(290, 0)" font-family="sans-serif" font-size="11" font-weight="600" fill="#1e293b">INCL. OF ALL TAXES (₹0.20/g)</text>
  </g>

  <!-- FADED INK STAMP BOX (Demonstrating OCR Low Confidence & Manual Review) -->
  <g transform="translate(130, 565)">
    <rect x="0" y="0" width="540" height="85" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="20" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#c2410c">
      INKJET LOT PRINT (SMUDGED / FADED REGION):
    </text>
    <!-- Faded / Low contrast dot matrix text -->
    <text x="20" y="55" font-family="monospace" font-size="18" font-weight="700" fill="#9ca3af" opacity="0.45" letter-spacing="3">
      PKD: 0?:2025  LOT:GD-05-A  EXP:0?:2025
    </text>
    <text x="20" y="74" font-family="sans-serif" font-size="11" font-weight="700" fill="#ea580c">
      ⚠️ Low OCR confidence (52%). Dot-matrix imprint requires officer visual check.
    </text>
  </g>

  <!-- Manufacturer Details -->
  <g transform="translate(130, 670)">
    <rect x="0" y="0" width="540" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#121a3e">MANUFACTURED BY:</text>
    <text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#0b1026">
      Britannia Industries Limited, 5/1A Hungerford Street, Kolkata - 700017
    </text>
    <text x="20" y="70" font-family="sans-serif" font-size="12" font-weight="500" fill="#64748b">
      Lic. No. 10015043001129 · Product of India
    </text>
  </g>

  <!-- Consumer Care Box -->
  <g transform="translate(130, 780)">
    <rect x="0" y="0" width="540" height="80" rx="10" fill="#eff6ff" stroke="#3d5afe" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">CONSUMER CARE CELL:</text>
    <text x="20" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#0b1026">
      Toll Free: 1800-425-4449 | Email: feedback@britindia.com
    </text>
    <text x="20" y="68" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">
      Prestige Shantiniketan, Tower C, Whitefield, Bengaluru - 560048
    </text>
  </g>
</svg>
