<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" fill="none">
  <defs>
    <linearGradient id="oil-bg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffdf0"/>
      <stop offset="60%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="oil-blue" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Pouch Outline -->
  <rect x="100" y="50" width="600" height="900" rx="40" fill="url(#oil-bg)" stroke="#121a3e" stroke-width="4"/>
  <!-- Top pillow seal crimp -->
  <rect x="100" y="50" width="600" height="40" rx="10" fill="#0284c7" opacity="0.15"/>
  <line x1="120" y1="70" x2="680" y2="70" stroke="#0284c7" stroke-width="4" stroke-dasharray="10 6"/>

  <!-- Brand Banner -->
  <rect x="140" y="120" width="520" height="110" rx="18" fill="url(#oil-blue)"/>
  <text x="400" y="178" font-family="'Instrument Serif', serif" font-size="58" font-weight="700" fill="#ffffff" text-anchor="middle">
    FORTUNE
  </text>
  <text x="400" y="212" font-family="sans-serif" font-size="16" font-weight="700" fill="#fde047" text-anchor="middle" letter-spacing="4">
    SUNLITE · REFINED SUNFLOWER OIL
  </text>

  <!-- Sunflower Graphic -->
  <g transform="translate(330, 260)">
    <circle cx="70" cy="70" r="35" fill="#713f12"/>
    <circle cx="70" cy="70" r="30" fill="#451a03"/>
    <!-- Petals -->
    <path d="M70 15 L78 35 L62 35 Z M70 125 L78 105 L62 105 Z M15 70 L35 78 L35 62 Z M125 70 L105 78 L105 62 Z" fill="#eab308"/>
    <path d="M31 31 L48 45 L40 55 Z M109 109 L92 95 L100 85 Z M109 31 L95 48 L85 40 Z M31 109 L48 92 L40 100 Z" fill="#facc15"/>
  </g>

  <!-- Net Quantity Dual Declaration (Volume and Weight) -->
  <g transform="translate(140, 430)">
    <rect x="0" y="0" width="240" height="110" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <text x="20" y="32" font-family="sans-serif" font-size="12" font-weight="700" fill="#0369a1">NET VOLUME &amp; WEIGHT</text>
    <text x="20" y="70" font-family="sans-serif" font-size="30" font-weight="800" fill="#0b1026">1 L</text>
    <text x="20" y="94" font-family="sans-serif" font-size="12" font-weight="600" fill="#475569">Equivalent: 910 g at 30°C</text>
  </g>

  <!-- MRP Area with ILLEGAL STICKER OVERLAY -->
  <g transform="translate(400, 430)">
    <rect x="0" y="0" width="260" height="110" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="20" y="28" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b">ORIGINAL PRINTED MRP:</text>
    <!-- Stricken out original price underneath -->
    <text x="20" y="55" font-family="sans-serif" font-size="20" font-weight="600" fill="#94a3b8" text-decoration="line-through">₹ 125.00</text>

    <!-- Paste-over yellow sticker (VIOLATION) -->
    <g transform="translate(10, 45) rotate(-3)">
      <rect x="0" y="0" width="230" height="52" rx="6" fill="#fef08a" stroke="#dc2626" stroke-width="2"/>
      <text x="15" y="26" font-family="sans-serif" font-size="11" font-weight="800" fill="#dc2626">REVISED MRP (STICKER):</text>
      <text x="15" y="46" font-family="sans-serif" font-size="20" font-weight="900" fill="#b91c1c">₹ 145.00 INCL. TAX</text>
    </g>
  </g>

  <!-- Notice Banner for Violation -->
  <g transform="translate(140, 560)">
    <rect x="0" y="0" width="520" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#b91c1c">
      ⚠️ EVIDENCE DETECTED: Secondary price sticker pasted over original MRP of ₹125
    </text>
  </g>

  <!-- Batch & Date -->
  <g transform="translate(140, 620)">
    <rect x="0" y="0" width="520" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="36" font-family="sans-serif" font-size="13" font-weight="700" fill="#121a3e">
      MFG: 03/2025 | BATCH NO: LOT-SFO-4412 | BEST BEFORE 9 MONTHS
    </text>
  </g>

  <!-- Manufacturer Details -->
  <g transform="translate(140, 700)">
    <rect x="0" y="0" width="520" height="85" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#121a3e">MANUFACTURED BY:</text>
    <text x="20" y="48" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#0b1026">
      Adani Wilmar Limited, Fortune House, Near Navrangpura Rly. Crossing, Ahmedabad - 380009
    </text>
    <text x="20" y="68" font-family="sans-serif" font-size="11" font-weight="500" fill="#64748b">
      FSSAI Lic. No. 10013021000853 · Product of India
    </text>
  </g>

  <!-- Consumer Care Box -->
  <g transform="translate(140, 805)">
    <rect x="0" y="0" width="520" height="75" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="20" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#0369a1">CONSUMER CARE CELL:</text>
    <text x="20" y="50" font-family="sans-serif" font-size="13" font-weight="700" fill="#0c4a6e">
      Toll Free: 1800-233-9999 | Email: care@adaniwilmar.in
    </text>
  </g>
</svg>
